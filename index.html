<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロト予想</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Yu Gothic", sans-serif;
  background: #40cfd0; /* ターコイズブルー */
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  background: #ffffff;
  padding: 20px;
  border-radius: 12px;
}

/* 見出し */
h2 {
  text-align: center;
  margin-bottom: 16px;
}

/* 入力 */
input, select {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
  font-size: 1em;
}

input[type="checkbox"] {
  width: auto;
  margin-right: 6px;
}

/* ボタン */
button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  font-size: 1em;
}

button.loto6 {
  background: #ff9800;
  color: #fff;
}

button.loto7 {
  background: #3f51b5;
  color: #fff;
}

button.sub {
  width: auto;
  padding: 4px 10px;
  font-size: 0.85em;
  background: #ccc;
}

/* 保存表示 */
.storage-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.notice {
  font-size: 0.85em;
  color: #008000;
}

/* チェック */
label {
  display: flex;
  align-items: center;
  margin: 8px 0;
}

/* ===== 結果表示（〇で囲む：元の方式） ===== */
#result {
  margin-top: 12px;
}

.result-line {
  display: flex;
  align-items: center;
  margin: 8px 0;
}

.ball {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  margin-right: 6px;
}


/* フッター */
.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 0.85em;
}

/* Cookie */
.cookie-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #222;
  color: #fff;
  padding: 10px;
  font-size: 0.85em;
  display: none;
  text-align: center;
}

.cookie-banner button {
  width: auto;
  margin-left: 10px;
  padding: 4px 10px;
}
</style>
</head>

<body>
<div class="container">
<h2>ロト番号生成</h2>

<input id="name" placeholder="名前">
<input id="birthdate" type="date">

<div class="storage-row">
  <div id="storageNotice" class="notice" style="display:none;">
    この端末に情報が保存されています
  </div>
  <button class="sub" onclick="clearStorage()">保存情報を削除</button>
</div>

<input id="drawDate" type="date">

<select id="patterns">
  <option value="1">1パターン</option>
  <option value="2">2パターン</option>
  <option value="3">3パターン</option>
  <option value="4">4パターン</option>
  <option value="5">5パターン</option>
</select>

<label>
  <input type="checkbox" id="showReason">
  数字選択の根拠を表示
</label>

<label>占い寄り / ランダム寄り</label>
<input type="range" id="fortuneRate" min="0" max="100" value="50">

<button class="loto6" onclick="generateNumbers('loto6')">ロト6</button>
<button class="loto7" onclick="generateNumbers('loto7')">ロト7</button>

<div id="result"></div>
</div>

<div class="footer">
  <a href="privacy_policy.html">プライバシーポリシー</a>
</div>

<div class="cookie-banner" id="cookieBanner">
このサイトは利便性向上のためCookieを使用します。
<button onclick="acceptCookie()">同意する</button>
</div>

<script>
const STORAGE_KEY = 'loto_user_profile';
const COOKIE_KEY = 'cookie_consent';

const nameEl = document.getElementById('name');
const birthEl = document.getElementById('birthdate');
const drawEl = document.getElementById('drawDate');
const patternsEl = document.getElementById('patterns');
const fortuneRateEl = document.getElementById('fortuneRate');
const noticeEl = document.getElementById('storageNotice');
const resultEl = document.getElementById('result');

function loadProfile() {
  const d = localStorage.getItem(STORAGE_KEY);
  if (!d) return;
  const o = JSON.parse(d);
  nameEl.value = o.name || '';
  birthEl.value = o.birthdate || '';
  noticeEl.style.display = 'block';
}

function saveProfile() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    name: nameEl.value,
    birthdate: birthEl.value
  }));
  noticeEl.style.display = 'block';
}

function clearStorage() {
  localStorage.removeItem(STORAGE_KEY);
  nameEl.value = '';
  birthEl.value = '';
  noticeEl.style.display = 'none';
}

function acceptCookie() {
  localStorage.setItem(COOKIE_KEY, 'yes');
  document.getElementById('cookieBanner').style.display = 'none';
}
if (!localStorage.getItem(COOKIE_KEY)) {
  document.getElementById('cookieBanner').style.display = 'block';
}

function hashSeed(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h << 5) - h + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function seededRandom(seed) {
  const x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function generatePattern(seed, max, count) {
  const s = new Set();
  let i = seed;
  while (s.size < count) {
    s.add(Math.floor(seededRandom(i++) * max) + 1);
  }
  return [...s].sort((a, b) => a - b);
}

function generateNumbers(type) {
  if (!nameEl.value || !birthEl.value || !drawEl.value) {
    alert('すべて入力してください');
    return;
  }

  saveProfile();

  const max = type === 'loto6' ? 43 : 37;
  const count = type === 'loto6' ? 6 : 7;
  const base = hashSeed(
    nameEl.value + birthEl.value + drawEl.value + fortuneRateEl.value
  );

  resultEl.innerHTML = '';
  for (let i = 0; i < patternsEl.value; i++) {
    const nums = generatePattern(base + i, max, count);
    const line = document.createElement('div');
    line.className = 'result-line';
    nums.forEach(n => {
      const ball = document.createElement('span');
      ball.className = 'ball';
      ball.textContent = n;
      line.appendChild(ball);
    });
    resultEl.appendChild(line);
  }
}

drawEl.value = new Date().toISOString().split('T')[0];
patternsEl.value = '1';
loadProfile();
</script>
</body>
</html>
